# MIRROR CONTROL: is routing valuable, or is it just sending most claims to the
# weakest blueprint?
#
# The first control (veritas_forced_media_control.yaml) forced the 211 claims that
# routing sent AWAY from media_document_... back into it, and MSE worsened
# 0.1998 -> 0.2666 (t=+2.02). But media_document_... is the pool's weakest
# blueprint (MSE 0.2552 on its own claims, ~0 lift over no-strategy), so that
# result cannot distinguish 'routing helps' from 'the forced blueprint is bad'.
#
# This is the mirror: the 784 claims routing sent TO media_document_..., forced
# instead into primary_source_... (MSE 0.1992 on its own claims, -0.0145 lift).
# Only that blueprint is present, so every claim resolves RULE_BASED.
#
# Compare paired against the same claim_ids in the full run (MSE 0.2552).
#   degrades -> blueprint/claim fit is real; routing is genuinely valuable
#   improves -> routing is an expensive way to reach the weaker blueprint;
#               just use primary_source_... for everything

