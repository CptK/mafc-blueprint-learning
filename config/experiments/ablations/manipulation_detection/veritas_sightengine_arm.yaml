# SIGHTENGINE ARM: what does the best REAL detector contribute end-to-end?
#
# Identical to out/veritas-2026_q1-7class-20260728-124458 in every respect
# (blueprints eom_v4, hybrid routing, models, judge n_samples) EXCEPT that the
# media agent gets the Sightengine detector. Compare against the oracle arm
# (out/veritas-2026_q1-7class-20260801-131339) to see how much of the ceiling a
# real detector reaches, and against the baseline for its absolute effect.
#
# Sample: the 277 claims whose image carries a non-"unknown" integrity label
# (211 manipulated / 112 authentic images) and that carry NO video. Videos are
# excluded because the detector evaluation in the appendix is images-only and
# because the Sightengine arm would otherwise incur live video billing.
#
# Compare PAIRED against the same claim_ids in
# out/veritas-2026_q1-7class-20260728-124458.
#
# store_only: true means NO live API calls. Every one of these 277 claims' images
# is in the precomputed store (373/374 labelled images are), so this run costs 0
# Sightengine operations; media picked up during evidence retrieval is reported as
# unchecked instead of being billed.
#
# Requires: sightengine_stores=data/veritas_2026_q1/sightengine

