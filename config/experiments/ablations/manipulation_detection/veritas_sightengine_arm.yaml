agents:
  fact_check:
    model: gemini_3_flash
    temperature: 1.0
    max_response_length: 64000
    workers: 4

  web_search:
    model: gemini_3_flash
    temperature: 1.0
    max_response_length: 20000
    workers: 4
    max_iterations: 2
    max_queries_per_step: 3
    max_results_per_query: 3
    summarization_model: gemini_3_flash
    summarization_thinking: false
    summarization_max_response_length: 5000

  media:
    model: gemini_3_flash
    temperature: 1.0
    max_response_length: 64000
    use_c2pa: false
    use_trufor: false
    use_sightengine: true
    sightengine_store_only: true   # never call the paid API; serve precomputed scores only
    use_oracle: false

  judge:
    model: gemini_3_flash
    temperature: 1.0
    max_response_length: 64000
    n_samples: 3

blueprints:
  selector_model: gemini_3_flash
  selector_max_response_length: 8192
  config_dir: out/learned_blueprints/2025/eom_v4
  selection_method: hybrid
  probe_confidence_threshold: 0.8

run:
  concurrency: 8
  timeout_per_sample:
  traces: true
  log_level: INFO
