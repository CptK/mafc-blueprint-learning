[tool.black]
line-length = 110
target-version = ["py313"]  # adjust to your Python version
include = '\.pyi?$'
extend-exclude = '''
/(
\.git
| \.venv
| venv
| build
| dist
| mafc/tools/media/trufor/model
| TruFor
)/
'''

[tool.ruff]
line-length = 110
# vendored upstream TruFor network, kept as-is for diffability
extend-exclude = ["mafc/tools/media/trufor/model", "TruFor"]

[tool.pytest.ini_options]
markers = [
  "integration: optional live API tests",
]


[tool.mypy]
python_version = "3.13"
exclude = ['^mafc/tools/media/trufor/model/', '^TruFor/']
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
# Vendored upstream TruFor network: kept byte-for-byte, so it is not type-checked.
# `exclude` alone does not cover it because mypy still follows imports into it.
module = "mafc.tools.media.trufor.model.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "ezmm.*",
    "yaml.*",
    "requests.*",
    "tqdm.*",
    "scrapemm.*",
]
ignore_missing_imports = true
